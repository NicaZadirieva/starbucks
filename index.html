<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarBucks</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/hero.css" />


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="body">
    <header class="header container">
        <h1 class="header__logo h1 text_gradient_helper">
            StarBucks
        </h1>
        <nav class="header__nav nav">
            <ul class="nav__ul ul">
                <li><a class="link nav__ul__link" href="#">Home</a></li>
                <li><a class="link nav__ul__link" href="#">Select</a></li>
                <li><a class="link nav__ul__link" href="#">Shop</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="hero">
            <h2 class="hero__title h2">
                New Cafe by <span class="hero__title__span">StarBucks</span>
            </h2>
            <p class="hero__description">
                Have time to buy the most harmonious drinks in the new Starbucks coffee and don't forget about the
                discount!
            </p>
            <div class="hero__btn_container">
                <button class="hero__btn btn btn-green">Select a coffee</button>
                <button class="btn hero__btn hero__btn--secondary btn-black">
                    More
                </button>
            </div>

            <ul class="hero__advantages ul">
                <li class="hero__advantage">
                    <div class="advantage__count">9k<span class="advantage__count__span">+</span></div>
                    <div class="advantage__name">
                        Premium Users
                    </div>
                </li>

                <li class="hero__advantage">
                    <div class="advantage__count">2k<span class="advantage__count__span">+</span></div>
                    <div class="advantage__name">
                        Happy Customers
                    </div>
                </li>

                <li class="hero__advantage">
                    <div class="advantage__count">28<span class="advantage__count__span">+</span></div>
                    <div class="advantage__name">
                        Awards Winning
                    </div>
                </li>
            </ul>
        </section>
    </main>
</body>

</html>
